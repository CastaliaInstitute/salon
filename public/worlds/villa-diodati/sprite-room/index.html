<html lang="en">

  <body>
    <canvas id="room" aria-label="Interactive isometric Villa Diodati salon"></canvas>
    <div id="dialogue-layer" aria-live="polite"></div>
    <section id="script-panel" aria-label="Salon dialogue script"><div class="script-heading">Salon script <span id="script-state">Listening to Matrix…</span></div><div id="script-lines"></div></section>

    <script type="module" src="./room.js?v=three-sprite-room-50"></script>
  </body>
