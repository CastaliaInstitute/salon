<!DOCTYPE html>
<!--
  Offline fallback — villa-dark, self-contained (no external requests).
  Served by the service worker when a navigation misses the network and the cache.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e1a16">
  <title>Offline | Salon</title>
  <style>
    :root {
      --bg: #1e1a16;
      --surface: #2d2520;
      --text: #faf8f5;
      --muted: rgba(250, 248, 245, 0.68);
      --accent: #d9a441;
      --border: rgba(250, 248, 245, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(env(safe-area-inset-top), 2rem) 1.5rem max(env(safe-area-inset-bottom), 2rem);
    }
    main {
      max-width: 30rem;
      text-align: center;
    }
    .mark { font-size: 2.5rem; line-height: 1; opacity: 0.9; }
    h1 {
      font-size: 1.5rem;
      font-weight: 400;
      margin: 1rem 0 0.75rem;
    }
    p { color: var(--muted); margin-bottom: 0.75rem; }
    button {
      margin-top: 1.25rem;
      font: inherit;
      font-size: 1rem;
      color: var(--accent);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 0.6rem 1.4rem;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🕯️</div>
    <h1>The candles are lit, but the network is not.</h1>
    <p>You can keep reading the pages you have already visited — they replay from the cache.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
