name: Salon quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run historical, Gym, and realtime regression tests
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build the production salon
        run: npm run build
