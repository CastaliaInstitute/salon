name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # package.json uses file:../CastaliaInstitute/castalia-platform (same layout as local ~/GitHub).
      # castalia-platform is private — authenticate with GITHUB_TOKEN (org must allow workflows to access private repos).
      - name: Clone castalia-platform (shared shell dependency)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ../CastaliaInstitute
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/CastaliaInstitute/castalia-platform.git" ../CastaliaInstitute/castalia-platform

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        env:
          PUBLIC_MATRIX_SERVER: ${{ vars.PUBLIC_MATRIX_SERVER }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
