name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # package.json uses file:../CastaliaInstitute/castalia-platform. castalia-platform is private.
      # Default GITHUB_TOKEN cannot read other private repos — use a PAT with repo read on castalia-platform.
      - uses: actions/checkout@v4
        with:
          repository: CastaliaInstitute/castalia-platform
          token: ${{ secrets.CASTALIA_PLATFORM_READ_TOKEN }}
          path: _deps/castalia-platform

      - name: Link castalia-platform for npm file: dependency
        run: |
          mkdir -p ../CastaliaInstitute
          ln -sfn "${GITHUB_WORKSPACE}/_deps/castalia-platform" "${GITHUB_WORKSPACE}/../CastaliaInstitute/castalia-platform"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        env:
          PUBLIC_MATRIX_SERVER: ${{ vars.PUBLIC_MATRIX_SERVER }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
