name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build with Astro
        env:
          PUBLIC_MATRIX_SERVER: ${{ vars.PUBLIC_MATRIX_SERVER }}
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_DIODATI_TEST_OPENING_AT: ${{ vars.PUBLIC_DIODATI_TEST_OPENING_AT }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Smoke-test the published viewer
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          case "$SITE_URL" in
            */) ;;
            *) SITE_URL="$SITE_URL/" ;;
          esac
          viewer_url="${SITE_URL}worlds/villa-diodati/sprite-room/"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-connrefused "$viewer_url" > /tmp/sprite-room.html
          grep -Eq 'room\.js\?v=[^" ]+' /tmp/sprite-room.html
